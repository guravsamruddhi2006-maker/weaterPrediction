<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="search-group">
          <input id="cityInput" type="text" placeholder="Search city..." />
          <button id="searchBtn">Search</button>
        </div>
        <button id="locationBtn" class="secondary-btn">Use My Location</button>
      </header>

      <main class="dashboard">
        <section class="card current-weather">
          <div class="location-row">
            <div>
              <p class="eyebrow">Current Weather</p>
              <h1 id="cityName">Loading...</h1>
            </div>
            <p id="currentDate" class="date"></p>
          </div>

          <div class="temp-row">
            <div id="weatherIcon" class="weather-icon">☀️</div>
            <div>
              <div id="temperature" class="temperature">--°C</div>
              <div id="condition" class="condition">--</div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span>Feels like</span>
              <strong id="feelsLike">--°C</strong>
            </div>
            <div class="stat">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat">
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat">
              <span>Sunrise</span>
              <strong id="sunrise">--:--</strong>
            </div>
            <div class="stat">
              <span>Sunset</span>
              <strong id="sunset">--:--</strong>
            </div>
          </div>
        </section>

        <section class="forecast-section">
          <div class="forecast-header">
            <h2>7-Day Forecast</h2>
          </div>
          <div id="forecast" class="forecast-grid"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
